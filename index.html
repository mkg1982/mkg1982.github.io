<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НастяGPT — Самый бесполезный ИИ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f6;
            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 100%;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            object-position: 50% 25%;
            margin: 0 auto 20px;
            display: block;
            border: 3px solid #e5e5ea;
        }
        h2 {
            margin: 0 0 8px;
            font-size: 24px;
        }
        .iq {
            font-size: 14px;
            color: #8e8e93;
            font-weight: 600;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        .status {
            font-size: 14px;
            color: #636366;
            font-style: italic;
            margin-bottom: 20px;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Замените 'photo.jpg' на название или ссылку вашего файла -->
        <img src="photo.jpg" alt="Аватар" class="avatar">
        
        <h2>ГлупоGPT v0.01</h2>
        <div class="iq">IQ: комнатная температура</div>
        
        <p>Привет! Я искусственный интеллект. Спроси меня что-нибудь, и я постараюсь неправильно ответить!</p>
        
        <div class="status">ГлупоGPT напрягает единственную извилину...</div>
        
        <button onclick="alert('Я забыл, о чём ты спросил.')">Спросить</button>
    </div>

</body>
</html>
